[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "harvester"
dynamic = ["version"]
description = "Polite, reproducible web harvesting: fetch once, parse forever."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sarthak Pahwa" }]
requires-python = ">=3.10"
keywords = ["scraping", "crawling", "harvesting", "oai-pmh", "dspace", "robots.txt", "data-pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "scrapling[fetchers]>=0.4.15",
    "protego>=0.4",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "orjson>=3.10",
    "w3lib>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
harvester = "harvester.cli:app"

[project.entry-points."harvester.sources"]
oai-pmh = "harvester.sources.oai_pmh:OAIPMHSource"
dspace = "harvester.sources.dspace:DSpaceSource"
india-code = "harvester.sources.india_code:IndiaCodeSource"

[project.urls]
Homepage = "https://github.com/sarthak213/harvester"
Issues = "https://github.com/sarthak213/harvester/issues"

[tool.hatch.version]
path = "src/harvester/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harvester"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PTH"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "harvester.cli"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:The 'strip_cdata' option:DeprecationWarning",
    "ignore::curl_cffi.utils.CurlCffiWarning",
]
